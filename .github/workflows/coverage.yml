name: Coverage

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to run coverage against (uses its merge ref)'
        required: false
        type: string
      ref:
        description: 'Branch, tag, or SHA. Ignored when pr_number is provided.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.event.inputs.pr_number || github.event.inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  unit-coverage:
    name: Unit Test Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      ref: ${{ steps.resolve-ref.outputs.ref }}
      base_sha: ${{ steps.resolve-base.outputs.base_sha }}
    steps:
      - name: Resolve checkout ref
        id: resolve-ref
        env:
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
          MANUAL_REF: ${{ github.event.inputs.ref }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo 'Invalid PR number'; exit 1; }
            echo "ref=refs/pull/${PR_NUMBER}/merge" >> "$GITHUB_OUTPUT"
          elif [ -n "$MANUAL_REF" ]; then
            [[ "$MANUAL_REF" != *$'\n'* && "$MANUAL_REF" != *$'\r'* ]] || exit 1
            echo "ref=${MANUAL_REF}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${GITHUB_REF}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.resolve-ref.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve base SHA for manual PR run
        id: resolve-base
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number != '' }}
        run: echo "base_sha=$(git rev-parse HEAD^1)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Run unit tests with coverage
        run: pnpm test:unit:coverage

      - name: Save coverage reports
        if: ${{ always() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: head-coverage
          path: packages/*/coverage/lcov.info
          retention-days: 7

      - name: Prepare baseline worktree
        id: baseline
        if: ${{ !cancelled() && steps.resolve-base.outputs.base_sha != '' }}
        env:
          BASE_SHA: ${{ steps.resolve-base.outputs.base_sha }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/coverage-baseline" "$BASE_SHA"
          echo "path=$RUNNER_TEMP/coverage-baseline" >> "$GITHUB_OUTPUT"

      - name: Run baseline coverage
        if: ${{ !cancelled() && steps.baseline.outputs.path != '' }}
        working-directory: ${{ steps.baseline.outputs.path }}
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm test:unit:coverage

      - name: Save baseline coverage reports
        if: ${{ always() && steps.baseline.outputs.path != '' }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: base-coverage
          path: ${{ steps.baseline.outputs.path }}/packages/*/coverage/lcov.info
          retention-days: 7

      - name: Cleanup baseline worktree
        if: ${{ always() && steps.baseline.outputs.path != '' }}
        run: git worktree remove --force "$RUNNER_TEMP/coverage-baseline"

  report:
    name: Publish Coverage Report
    needs: unit-coverage
    if: ${{ !cancelled() && needs.unit-coverage.outputs.ref != '' && (github.event_name == 'push' || inputs.pr_number != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      # PR code runs only in the read-only job above. Reporting uses trusted main scripts.
      - name: Checkout report scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26

      - name: Download head coverage
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        continue-on-error: ${{ needs.unit-coverage.result != 'success' }}
        with:
          name: head-coverage
          path: reports/head/packages

      - name: Download baseline coverage
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number != '' }}
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        continue-on-error: true
        with:
          name: base-coverage
          path: reports/base/packages

      - name: Build PR coverage report
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number != '' }}
        env:
          RESOLVED_REF: ${{ needs.unit-coverage.outputs.ref }}
          JOB_STATUS: ${{ needs.unit-coverage.result }}
          CODECOV_API_TOKEN: ${{ secrets.CODECOV_API_TOKEN || secrets.CODECOV_TOKEN }}
          HEAD_COVERAGE_ROOT: reports/head
          BASE_COVERAGE_ROOT: reports/base
          BASE_COVERAGE_REF: ${{ needs.unit-coverage.outputs.base_sha }}
        run: node scripts/build-coverage-pr-report.mts

      - name: Comment coverage report to PR
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REPO: ${{ github.repository }}
        run: node scripts/comment-coverage-pr.mts

      - name: Upload coverage reports to Codecov
        if: ${{ github.event_name == 'push' && needs.unit-coverage.result == 'success' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          disable_search: true
          override_commit: ${{ github.sha }}
          files: reports/head/packages/core/coverage/lcov.info,reports/head/packages/angular/coverage/lcov.info,reports/head/packages/nuxt/coverage/lcov.info,reports/head/packages/react/coverage/lcov.info,reports/head/packages/svelte/coverage/lcov.info,reports/head/packages/vue/coverage/lcov.info
