name: Browser AI type package updates

on:
  schedule:
    - cron: '17 9 * * *'
      timezone: Europe/Podgorica
  workflow_dispatch:

concurrency:
  group: type-package-updates
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Check npm for browser API type updates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26

      - name: Request investigation of new type releases
        run: node scripts/check-type-updates.mts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
